[project]
name = "eciguia"
version = "0.1.0"
description = "Asistente académico de la Escuela Colombiana de Ingeniería con RAG, LangGraph y MCP, 100 % local con Ollama"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain-core>=1.8",
    "langchain-text-splitters>=1.1",
    "langchain-ollama>=1.1",
    "langchain-chroma>=1.1",
    "chromadb>=1.5",
    "langgraph>=1.2",
    "fastmcp>=4.2",
    "pdfplumber>=0.11",
    "gradio>=6.0",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0",
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
    "pandas>=2.2",
    "jupyterlab>=4.2",
    "ipykernel>=6.29",
    "nbconvert>=7.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eciguia"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
